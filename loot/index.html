<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaR Loot Tables</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e8eef5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 3px solid #00d9ff;
            padding-bottom: 30px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            color: #00d9ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #ff6b35;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid #00d9ff;
            border-radius: 4px;
            color: #e8eef5;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            max-width: 400px;
        }

        .search-box::placeholder {
            color: rgba(232, 238, 245, 0.4);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 30px;
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid #00d9ff;
            color: #00d9ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .tab-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .tab-btn.active {
            background: #00d9ff;
            color: #0a0e27;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.5);
        }

        .content {
            background: rgba(10, 14, 39, 0.5);
            border: 2px solid #00d9ff;
            border-radius: 4px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loot-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .loot-table th {
            background: rgba(0, 217, 255, 0.1);
            padding: 15px;
            text-align: left;
            font-family: 'Orbitron', sans-serif;
            color: #00d9ff;
            border-bottom: 2px solid #00d9ff;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .loot-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0, 217, 255, 0.2);
        }

        .loot-table tr:hover {
            background: rgba(0, 217, 255, 0.05);
        }

        .item-name {
            color: #e8eef5;
            font-weight: 500;
        }

        .probability-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .probability-bar {
            flex: 1;
            height: 20px;
            background: rgba(10, 14, 39, 0.8);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #00d9ff;
        }

        .probability-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff 0%, #ff6b35 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #0a0e27;
            font-weight: 600;
        }

        .probability-value {
            color: #ff6b35;
            font-weight: 600;
            min-width: 50px;
        }

        .amount-range {
            color: #a0aec0;
            font-size: 13px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
            font-size: 16px;
        }

        .sort-indicator {
            display: inline-block;
            margin-left: 5px;
            color: #ff6b35;
        }

        .table-header {
            cursor: pointer;
            user-select: none;
        }

        .table-header:hover {
            color: #ff6b35;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }

            .content {
                padding: 15px;
            }

            .loot-table {
                font-size: 12px;
            }

            .loot-table th,
            .loot-table td {
                padding: 8px;
            }

            .probability-bar {
                height: 15px;
            }

            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CaR Loot Tables</h1>
            <p class="subtitle">Alpha Loot Probability Reference</p>
        </header>

        <div class="controls">
            <input type="text" class="search-box" id="searchInput" placeholder="Search items...">
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bradley')">Bradley Crate</button>
            <button class="tab-btn" onclick="switchTab('heli')">Heli Crate</button>
            <button class="tab-btn" onclick="switchTab('main')">Main Crate</button>
        </div>

        <div class="content">
            <div id="bradley" class="tab-content active">
                <table class="loot-table" id="bradleyTable">
                    <thead>
                        <tr>
                            <th class="table-header" onclick="sortTable('bradley', 0)">Item <span class="sort-indicator"></span></th>
                            <th class="table-header" onclick="sortTable('bradley', 1)">Drop Chance <span class="sort-indicator"></span></th>
                            <th class="table-header">Amount</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="heli" class="tab-content">
                <table class="loot-table" id="heliTable">
                    <thead>
                        <tr>
                            <th class="table-header" onclick="sortTable('heli', 0)">Item <span class="sort-indicator"></span></th>
                            <th class="table-header" onclick="sortTable('heli', 1)">Drop Chance <span class="sort-indicator"></span></th>
                            <th class="table-header">Amount</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="main" class="tab-content">
                <table class="loot-table" id="mainTable">
                    <thead>
                        <tr>
                            <th class="table-header" onclick="sortTable('main', 0)">Item <span class="sort-indicator"></span></th>
                            <th class="table-header" onclick="sortTable('main', 1)">Drop Chance <span class="sort-indicator"></span></th>
                            <th class="table-header">Amount</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Loot data will be loaded from JSON files
        let lootData = {
            bradley: {},
            heli: {},
            main: {}
        };
        let displayNames = {};

        let currentSort = { table: null, column: null, ascending: true };

        // Load loot data from JSON files
        async function loadLootData() {
            try {
                const [bradleyRes, heliRes, mainRes, namesRes] = await Promise.all([
                    fetch('/loot/data/bradley.json'),
                    fetch('/loot/data/heli.json'),
                    fetch('/loot/data/main.json'),
                    fetch('/loot/data/displayNames.json')
                ]);

                lootData.bradley = await bradleyRes.json();
                lootData.heli = await heliRes.json();
                lootData.main = await mainRes.json();
                displayNames = await namesRes.json();

                initializeTables();
            } catch (error) {
                console.error('Error loading loot data:', error);
                document.querySelector('.content').innerHTML = '<p style="color: #ff6b35; padding: 20px;">Error loading loot tables. Make sure JSON files are in /loot/data/</p>';
            }
        }

        function initializeTables() {
            populateTable('bradley');
            populateTable('heli');
            populateTable('main');
        }

        function getDisplayName(shortname) {
            return displayNames[shortname] || shortname;
        }

        function populateTable(crate) {
            const tableId = crate + 'Table';
            const table = document.getElementById(tableId);
            const tbody = table.querySelector('tbody');
            const data = lootData[crate];

            tbody.innerHTML = '';

            const items = Object.entries(data)
                .map(([name, info]) => ({
                    name,
                    displayName: getDisplayName(name),
                    prob: info.prob,
                    min: info.min,
                    max: info.max
                }))
                .sort((a, b) => b.prob - a.prob);

            items.forEach(item => {
                const row = document.createElement('tr');
                const maxProb = Math.max(...Object.values(data).map(i => i.prob));
                const percentage = (item.prob / maxProb) * 100;

                row.innerHTML = `
                    <td class="item-name">${item.displayName}</td>
                    <td>
                        <div class="probability-cell">
                            <div class="probability-bar">
                                <div class="probability-fill" style="width: ${percentage}%">
                                    ${item.prob.toFixed(1)}%
                                </div>
                            </div>
                            <span class="probability-value">${item.prob.toFixed(1)}%</span>
                        </div>
                    </td>
                    <td class="amount-range">${item.min === item.max ? item.min : item.min + '-' + item.max}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function switchTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            // Show selected tab
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            filterTable(tab);
        }

        function filterTable(crate) {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const table = document.getElementById(crate + 'Table');
            const rows = table.querySelectorAll('tbody tr');

            rows.forEach(row => {
                const itemName = row.querySelector('.item-name').textContent.toLowerCase();
                if (itemName.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });

            if (rows.length > 0 && [...rows].every(r => r.style.display === 'none')) {
                if (!table.querySelector('.no-results')) {
                    const noResults = document.createElement('tr');
                    noResults.className = 'no-results';
                    noResults.innerHTML = '<td colspan="3">No items found matching "' + searchTerm + '"</td>';
                    table.querySelector('tbody').appendChild(noResults);
                }
            } else {
                const noResults = table.querySelector('.no-results');
                if (noResults) noResults.remove();
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const activeTab = document.querySelector('.tab-content.active').id;
            filterTable(activeTab);
        });

        function sortTable(crate, column) {
            // Implementation for sorting if needed
            console.log('Sort:', crate, column);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadLootData);
    </script>
</body>
</html>
