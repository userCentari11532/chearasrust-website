<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaR Legendary Loot Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0e14;
  --bg-card: #151b24;
  --teal: #00d9ff;
  --teal-dim: #008fa3;
  --text-primary: #e8edf2;
  --text-secondary: #8a95a3;
  --accent-orange: #ff6b35;
  --border: #1f2937;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  line-height: 1.6;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

header {
  padding: 50px 0 30px;
  text-align: center;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 900;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--accent-orange) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tagline {
  font-size: 1rem;
  color: var(--text-secondary);
  font-weight: 300;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.alpha-tag {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 14px;
  border: 1px solid var(--accent-orange);
  color: var(--accent-orange);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 4px;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 30px 0 10px;
}

.controls input, .controls select {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 1rem;
}

.controls input {
  flex: 1;
  min-width: 200px;
}

.controls input:focus, .controls select:focus {
  outline: none;
  border-color: var(--teal);
}

.count-line {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin: 0 0 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 60px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  transition: all 0.25s ease;
}

.card:hover {
  border-color: var(--teal);
  transform: translateY(-2px);
}

.card-image {
  width: 100%;
  aspect-ratio: 1;
  background: var(--bg-dark);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: 1px;
}

.card-sub {
  font-size: 0.85rem;
  color: var(--teal);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

.perks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.perk-row {
  display: flex;
  justify-content: space-between;
  background: rgba(0, 217, 255, 0.05);
  border-left: 2px solid var(--teal);
  padding: 6px 10px;
  font-size: 0.85rem;
  border-radius: 0 4px 4px 0;
}

.perk-row .val {
  font-weight: 700;
  color: var(--teal);
}

.drops-label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 10px 0 6px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

.drops-table {
  width: 100%;
  font-size: 0.8rem;
  border-collapse: collapse;
}

.drops-table td {
  padding: 3px 0;
}

.drops-table tr {
  border-bottom: 1px solid var(--border);
}

.drops-table tr:last-child {
  border-bottom: none;
}

.drops-table .source {
  color: var(--text-secondary);
}

.drops-table .pct {
  text-align: right;
  font-weight: 700;
  color: var(--accent-orange);
  white-space: nowrap;
}

.no-drops {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-style: italic;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 10px;
}

.more-sources {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 6px;
}

.flavor {
  font-size: 0.85rem;
  font-style: italic;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: auto;
  line-height: 1.5;
}

.empty-msg {
  display: none;
  text-align: center;
  color: var(--text-secondary);
  padding: 60px 0;
  font-size: 1.1rem;
}

footer {
  text-align: center;
  padding: 30px 0;
  color: var(--text-secondary);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

.status-msg {
  text-align: center;
  color: var(--text-secondary);
  padding: 60px 0;
  font-size: 1.1rem;
}

.status-msg.error {
  color: var(--accent-orange);
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Legendary Loot</h1>
    <p class="tagline">Clear as Rust &mdash; Item Reference</p>
    <span class="alpha-tag">Pre-Alpha &middot; Subject to Change</span>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Search items, perks, weapons, or drop sources..." />
    <select id="sourceFilter">
      <option value="">All drop sources</option>
    </select>
  </div>

  <p class="count-line" id="count"></p>

  <div class="grid" id="grid"></div>
  <p class="status-msg" id="empty" style="display:none;">No items match your search.</p>
  <p class="status-msg" id="loading">Loading legendary data&hellip;</p>
  <p class="status-msg error" id="loaderr" style="display:none;"></p>

  <footer>
    &copy; 2026 Clear as Rust. Drop percentages = table chance &times; item's share of the weighted pool.
  </footer>
</div>

<script>
// ---------------------------------------------------------------------
// Display name mapping for item shortnames -> friendly weapon/armor names
// ---------------------------------------------------------------------
const displayNames = {
  "rifle.ak": "AK-47", "rifle.bolt": "Bolt Action Rifle", "rifle.lr300": "LR-300", "rifle.l96": "L96",
  "rifle.m39": "M39", "rifle.sks": "SKS", "rifle.semiauto": "Semi-Auto Rifle",
  "lmg.m249": "M249", "smg.mp5": "MP5", "hmlmg": "HMLMG",
  "metal.facemask": "Metal Face Mask", "metal.plate.torso": "Metal Chest Plate",
  "pistol.python": "Python Revolver", "pistol.semiauto": "Semi-Auto Pistol",
  "rocket.launcher": "Rocket Launcher",
  "revolver.hc": "High Caliber Revolver", "blunderbuss": "Blunderbuss",
  "multiplegrenadelauncher": "Grenade Launcher", "shotgun.m4": "MP5 Shotgun (M4)",
  "shotgun.pump": "Pump Shotgun", "minigun": "Minigun", "crossbow": "Crossbow",
  "bow.hunting": "Hunting Bow", "knife.combat": "Combat Knife", "knife.bone": "Bone Knife",
  "bone.club": "Bone Club", "pickaxe": "Pickaxe", "axe.salvaged": "Salvaged Axe",
  "pitchfork": "Pitchfork", "jackhammer": "Jackhammer", "hammer": "Hammer",
  "icepick.salvaged": "Salvaged Icepick", "fishingrod.handmade": "Fishing Rod", "torch": "Torch",
  "pipetool": "Pipe Tool", "roadsign.kilt": "Road Sign Kilt", "roadsign.jacket": "Road Sign Jacket",
  "pants": "Pants", "hoodie": "Hoodie", "mask.bandana": "Bandana Mask",
  "coffeecan.helmet": "Coffee Can Helmet", "hazmatsuit": "Hazmat Suit",
  "halloween.mummysuit": "Mummy Suit", "tactical.gloves": "Tactical Gloves",
  "shoes.boots": "Boots", "diving.wetsuit": "Diving Wetsuit", "diving.mask": "Diving Mask",
  "diving.fins": "Diving Fins", "jacket": "Jacket", "largebackpack": "Large Backpack",
  "shovel": "Shovel", "speargun": "Speargun", "riot.helmet": "Riot Helmet",
  "bandage": "Bandage", "cakefiveyear": "Anniversary Cake", "keycard_green": "Green Keycard",
  "military flamethrower": "Flamethrower"
};

function displayName(shortname) {
  if (displayNames[shortname]) return displayNames[shortname];
  return shortname.split(/[._ ]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

// ---------------------------------------------------------------------
// Perk label mapping
// ---------------------------------------------------------------------
const weaponPerkLabels = {
  HeliDamage:"Heli damage", ScientistBane:"Scientist bane", Thorns:"Thorns", BeastBane:"Beast bane",
  Vampiric:"Vampiric", ScientistWard:"Scientist ward", BradleyDamage:"Bradley damage", UncannyDodge:"Uncanny dodge",
  FlakJacket:"Flak jacket", Lumberjack:"Lumberjack", BeastWard:"Beast ward", WoodcuttingLuck:"Woodcutting luck",
  Butcher:"Butcher", SkinningLuck:"Skinning luck", Tanner:"Tanner", Scavenger:"Scavenger", ComponentLuck:"Component luck",
  ElectronicsLuck:"Electronics luck", MiningLuck:"Mining luck", BlastMine:"Blast mine", Prospector:"Prospector",
  Horticulture:"Horticulture", Regeneration:"Regeneration", Forager:"Forager", Builder:"Builder", Smelter:"Smelter",
  Prepper:"Prepper", FishingLuck:"Fishing luck", Angler:"Angler", LineStrength:"Line strength", Fabricate:"Fabricate",
  Thrifty:"Thrifty", IronStomach:"Iron stomach", Pharmaceutical:"Pharmaceutical", MeleeWard:"Melee ward",
  Lead:"Lead", HealShare:"Heal share", Paramedic:"Paramedic",
  Durable:"Durable", Manufacture:"Manufacture", Environmentalist:"Environmentalist", Reinforced:"Reinforced",
  Deforest:"Deforest", SharkWard:"Shark ward", SharkBane:"Shark bane", FallDamage:"Fall damage",
  Elemental:"Elemental", RockCycler:"Rock cycler"
};

// ---------------------------------------------------------------------
// Perk descriptions (shown as tooltip on hover)
// ---------------------------------------------------------------------
const perkDescriptions = {
  Prospector: "Increases your mining yield when mining stone, metal and sulfur nodes.",
  Lumberjack: "Increases your woodcutting yield when chopping living or dead trees.",
  Butcher: "Increases the resources gained from skinning humans and animals.",
  Horticulture: "Increases the amount of resources gained when harvesting grown plants.",
  Forager: "Increases the amount of resources gained when picking up map generated collectibles.",
  Angler: "Increases the amount of fish you receive upon a successful catch.",
  BeastBane: "Increases the damage dealt to animals.",
  ScientistBane: "Increases the damage dealt to scientists.",
  FlakJacket: "Reduces the damage received from explosions.",
  Elemental: "Reduces damage received from cold and heat sources.",
  Scavenger: "Provides a chance to find additional scrap from crates and barrels.",
  Manufacture: "Increases the speed of your crafting.",
  Durable: "Reduces the durability damage of all equipped items.",
  BeastWard: "Reduces the damage received from animals.",
  ScientistWard: "Reduces the damage received from scientists.",
  Builder: "Provides a chance for your building upgrades to be free.",
  Thrifty: "Provides a chance for your crafting components to be refunded upon a successful craft.",
  Fabricate: "Provides a chance to duplicate an item upon a successful craft.",
  Pharmaceutical: "Increases the amount of healing received from all sources.",
  MeleeWard: "Reduces the damage received from melee weapons.",
  Academic: "Provides a chance to receive a scrap refund when researching an item at the research bench.",
  FallDamage: "Reduces the impact damage received from falling.",
  Lead: "Reduces the damage from radiation.",
  Smasher: "Provides a chance to instantly destroy barrels with any amount of damage.",
  Environmentalist: "Increases the speed of recyclers that you activate.",
  Smelter: "Increases the smelting speed of furnaces you activate.",
  Paramedic: "Provides players that you revive with additional health.",
  Prepper: "Provides a chance to not consume food when eating.",
  Regeneration: "Passively regenerates your health.",
  SharkWard: "Reduces the amount of damage received from sharks.",
  SharkBane: "Increases the amount of damage dealt to sharks.",
  Deforest: "Provides a chance to cut down nearby trees when successfully cutting a tree down.",
  BlastMine: "Provides a chance to mine out nearby nodes when successfully mining out a node.",
  Tanner: "Provides a chance to skin nearby corpses when successfully skinning out a corpse.",
  Vampiric: "Heals you for a percentage of the damage dealt to certain enemies.",
  Reinforced: "Reduces the amount of damage that your vehicles receive when mounted.",
  ComponentLuck: "Provides a chance to receive additional components when looting barrels and crates.",
  ElectronicsLuck: "Provides a chance to receive additional electronics when looting barrels and crates.",
  UncannyDodge: "Provides a chance to dodge incoming damage, reducing it to 0.",
  LineStrength: "Increases the tensile strength of your fishing line.",
  HealShare: "Shares healing effects with nearby players.",
  Attractive: "Provides a chance to automatically pick up components when destroying barrels.",
  WoodcuttingLuck: "Provides a chance to find a random item when you cut down a tree.",
  MiningLuck: "Provides a chance to find a random item when you mine out a node.",
  SkinningLuck: "Provides a chance to find a random item when you skin out a corpse.",
  FishingLuck: "Provides a chance to find a random item when you catch a fish.",
  Sated: "Increases the amount of calories and hydration you receive from food and water sources.",
  IronStomach: "Provides a chance to negate negative effects when consuming food.",
  TreePlanter: "Provides a chance for a tree to instantly regrow when cut down.",
  RockCycler: "Provides a chance for a node to instantly respawn when mined out.",
  BradleyDamage: "Increases the damage dealt to Bradley Tanks.",
  HeliDamage: "Increases the damage dealt to Patrol Helicopters.",
  Thorns: "Reflects a % of the damage done back to the attacker."
};

// ---------------------------------------------------------------------
// Field name constants matching the raw plugin config
// ---------------------------------------------------------------------
const F_SHORTNAME = "Item shortname";
const F_SKIN = "Item skin";
const F_PERKS = "List of perks and modifiers that the item has [perk: modifier]";
const F_DESC = "Description about the item that is shown when mousing over the ownership banner [blank/null = nothing]";
const F_SLOTS = "How many armor mod slots will the item spawn with? [won't exceed item definitions max cap]";

const F_LOOT_SOURCE = "Loot source";
const F_LOOT_PREFAB = "Prefab shortname, boss profile, event name [null if not required]";
const F_LOOT_CHANCE = "Drop chance [%]";
const F_LOOT_ITEMS = "Items that can drop from this source [profile name: drop weight]";

let itemProfiles = {};
let lootProfiles = [];
let dropMap = {};
let skinImages = {};

function buildDropMap() {
  const map = {};
  for (const profile of lootProfiles) {
    const weights = profile[F_LOOT_ITEMS] || {};
    const totalWeight = Object.values(weights).reduce((a,b) => a+b, 0);
    if (totalWeight <= 0) continue;
    const chance = profile[F_LOOT_CHANCE] || 0;
    let sourceLabel = profile[F_LOOT_SOURCE] || "Unknown";
    const prefab = profile[F_LOOT_PREFAB];
    if (prefab) sourceLabel += " (" + prefab + ")";
    for (const [name, weight] of Object.entries(weights)) {
      if (!map[name]) map[name] = [];
      const pickPct = (weight / totalWeight) * 100;
      const overallPct = (chance / 100) * pickPct;
      map[name].push({source: sourceLabel, weight, tableChance: chance, pickPct, overallPct});
    }
  }
  return map;
}

function formatPerk(key, val) {
  const label = weaponPerkLabels[key] || key;
  let display;
  if (val < 1) display = '+' + Math.round(val * 100) + '%';
  else display = '+' + val + 'x';
  return label + ': ' + display;
}

function formatPct(p) {
  if (p >= 1) return p.toFixed(1) + '%';
  if (p >= 0.1) return p.toFixed(2) + '%';
  return p.toFixed(3) + '%';
}

function renderGrid() {
  const query = document.getElementById('search').value.toLowerCase();
  const sourceVal = sourceFilter.value;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  grid.innerHTML = '';
  let shown = 0;
  const total = Object.keys(itemProfiles).length;

  for (const [name, item] of Object.entries(itemProfiles)) {
    const drops = dropMap[name] || [];
    if (sourceVal && !drops.some(d => d.source === sourceVal)) continue;

    const shortname = item[F_SHORTNAME] || "";
    const skin = item[F_SKIN] || 0;
    const perks = item[F_PERKS] || {};
    const desc = item[F_DESC] || "";
    const slots = item[F_SLOTS] || 0;

    const friendlyBase = displayName(shortname);
    const perkText = Object.entries(perks).map(([k,v]) => formatPerk(k,v).toLowerCase()).join(' ');
    const sourceText = drops.map(d => d.source).join(' ').toLowerCase();
    const haystack = (name + ' ' + shortname + ' ' + friendlyBase + ' ' + desc + ' ' + perkText + ' ' + sourceText).toLowerCase();
    if (query && !haystack.includes(query)) continue;

    shown++;
    const card = document.createElement('div');
    card.className = 'card';

    const imgBox = document.createElement('div');
    imgBox.className = 'card-image';
    const imgUrl = skin ? skinImages[String(skin)] : null;
    const iconFile = shortname.replace(/ /g, '_') + '.png';
    if (imgUrl) {
      const imgEl = document.createElement('img');
      imgEl.src = imgUrl;
      imgEl.alt = name;
      imgEl.loading = 'lazy';
      // Fall back to default item icon if the skin image fails to load
      imgEl.onerror = function() {
        this.onerror = function() {
          imgBox.textContent = 'No image';
          imgBox.removeChild(this);
        };
        this.src = './icons/' + iconFile;
      };
      imgBox.appendChild(imgEl);
    } else {
      const imgEl = document.createElement('img');
      imgEl.src = './icons/' + iconFile;
      imgEl.alt = friendlyBase;
      imgEl.loading = 'lazy';
      imgEl.onerror = function() {
        imgBox.textContent = 'No image';
        imgBox.removeChild(this);
      };
      imgBox.appendChild(imgEl);
    }
    card.appendChild(imgBox);

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = name;
    card.appendChild(title);

    const sub = document.createElement('div');
    sub.className = 'card-sub';
    sub.textContent = friendlyBase + (skin ? ' \u00b7 skin ' + skin : '') + (slots ? ' \u00b7 ' + slots + ' slot' + (slots > 1 ? 's' : '') : '');
    card.appendChild(sub);

    const perksBlock = document.createElement('div');
    perksBlock.className = 'perks';
    for (const [k,v] of Object.entries(perks)) {
      const row = document.createElement('div');
      row.className = 'perk-row';
      const valDisplay = v < 1 ? '+' + Math.round(v*100) + '%' : '+' + v + 'x';
      const label = document.createElement('span');
      label.textContent = weaponPerkLabels[k] || k;
      if (perkDescriptions[k]) {
        label.title = perkDescriptions[k];
        label.style.cursor = 'help';
        label.style.borderBottom = '1px dotted currentColor';
      }
      const val = document.createElement('span');
      val.className = 'val';
      val.textContent = valDisplay;
      row.appendChild(label);
      row.appendChild(val);
      perksBlock.appendChild(row);
    }
    card.appendChild(perksBlock);

    if (drops.length) {
      const label = document.createElement('div');
      label.className = 'drops-label';
      label.textContent = 'Drops from (' + drops.length + ')';
      card.appendChild(label);

      const sorted = [...drops].sort((a,b) => b.overallPct - a.overallPct);
      const table = document.createElement('table');
      table.className = 'drops-table';

      sorted.slice(0, 6).forEach(d => {
        const row = document.createElement('tr');
        const tdName = document.createElement('td');
        tdName.className = 'source';
        tdName.textContent = d.source;
        const tdPct = document.createElement('td');
        tdPct.className = 'pct';
        tdPct.textContent = formatPct(d.overallPct);
        tdPct.title = 'Table chance ' + d.tableChance + '% \u00d7 pick chance ' + formatPct(d.pickPct) + ' (weight ' + d.weight + ')';
        row.appendChild(tdName);
        row.appendChild(tdPct);
        table.appendChild(row);
      });
      card.appendChild(table);

      if (drops.length > 6) {
        const more = document.createElement('div');
        more.className = 'more-sources';
        more.textContent = '+' + (drops.length - 6) + ' more sources';
        card.appendChild(more);
      }
    } else {
      const noDrops = document.createElement('div');
      noDrops.className = 'no-drops';
      noDrops.textContent = 'No drop source configured';
      card.appendChild(noDrops);
    }

    const flavor = document.createElement('div');
    flavor.className = 'flavor';
    flavor.textContent = desc ? ('"' + desc + '"') : '';
    card.appendChild(flavor);

    grid.appendChild(card);
  }

  empty.style.display = shown === 0 ? 'block' : 'none';
  count.textContent = 'Showing ' + shown + ' of ' + total + ' items';
}

const sourceFilter = document.getElementById('sourceFilter');

async function init() {
  const loading = document.getElementById('loading');
  const loaderr = document.getElementById('loaderr');
  try {
    const res = await fetch('./legendaries-data.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // skinImages.json is optional — page works without it, just shows "No image"
    try {
      const skinRes = await fetch('./skinImages.json');
      if (skinRes.ok) skinImages = await skinRes.json();
    } catch (_) {}

    itemProfiles = data["Item profiles"] || {};
    lootProfiles = data["Loot profiles"] || [];
    dropMap = buildDropMap();

    // Populate source filter with unique source labels, sorted alphabetically
    const sourceLabels = new Set();
    for (const profile of lootProfiles) {
      let label = profile[F_LOOT_SOURCE] || "Unknown";
      const prefab = profile[F_LOOT_PREFAB];
      if (prefab) label += " (" + prefab + ")";
      sourceLabels.add(label);
    }
    [...sourceLabels].sort().forEach(label => {
      const opt = document.createElement('option');
      opt.value = label;
      opt.textContent = label;
      sourceFilter.appendChild(opt);
    });

    loading.style.display = 'none';
    document.getElementById('search').addEventListener('input', renderGrid);
    sourceFilter.addEventListener('change', renderGrid);
    renderGrid();
  } catch (err) {
    loading.style.display = 'none';
    loaderr.style.display = 'block';
    loaderr.textContent = 'Failed to load legendary data: ' + err.message;
  }
}

init();
</script>
</body>
</html>
