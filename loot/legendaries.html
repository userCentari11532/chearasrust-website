<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaR Legendary Loot Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0e14;
  --bg-card: #151b24;
  --teal: #00d9ff;
  --teal-dim: #008fa3;
  --text-primary: #e8edf2;
  --text-secondary: #8a95a3;
  --accent-orange: #ff6b35;
  --border: #1f2937;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  line-height: 1.6;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

header {
  padding: 50px 0 30px;
  text-align: center;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 900;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--accent-orange) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tagline {
  font-size: 1rem;
  color: var(--text-secondary);
  font-weight: 300;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.alpha-tag {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 14px;
  border: 1px solid var(--accent-orange);
  color: var(--accent-orange);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 4px;
}

.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 30px 0 10px;
}

.controls input, .controls select {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 12px 16px;
  border-radius: 6px;
  font-size: 1rem;
}

.controls input {
  flex: 1;
  min-width: 200px;
}

.controls input:focus, .controls select:focus {
  outline: none;
  border-color: var(--teal);
}

.count-line {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin: 0 0 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 60px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  transition: all 0.25s ease;
}

.card:hover {
  border-color: var(--teal);
  transform: translateY(-2px);
}

.card-image {
  width: 100%;
  aspect-ratio: 1;
  background: var(--bg-dark);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  color: var(--text-secondary);
  font-size: 0.85rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: 1px;
}

.card-sub {
  font-size: 0.85rem;
  color: var(--teal);
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

.perks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}

.perk-row {
  display: flex;
  justify-content: space-between;
  background: rgba(0, 217, 255, 0.05);
  border-left: 2px solid var(--teal);
  padding: 6px 10px;
  font-size: 0.85rem;
  border-radius: 0 4px 4px 0;
}

.perk-row .val {
  font-weight: 700;
  color: var(--teal);
}

.drops-label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 10px 0 6px;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}

.drops-table {
  width: 100%;
  font-size: 0.8rem;
  border-collapse: collapse;
}

.drops-table td {
  padding: 3px 0;
}

.drops-table tr {
  border-bottom: 1px solid var(--border);
}

.drops-table tr:last-child {
  border-bottom: none;
}

.drops-table .source {
  color: var(--text-secondary);
}

.drops-table .pct {
  text-align: right;
  font-weight: 700;
  color: var(--accent-orange);
  white-space: nowrap;
}

.no-drops {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-style: italic;
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 10px;
}

.more-sources {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 6px;
}

.flavor {
  font-size: 0.85rem;
  font-style: italic;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: auto;
  line-height: 1.5;
}

.empty-msg {
  display: none;
  text-align: center;
  color: var(--text-secondary);
  padding: 60px 0;
  font-size: 1.1rem;
}

footer {
  text-align: center;
  padding: 30px 0;
  color: var(--text-secondary);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Legendary Loot</h1>
    <p class="tagline">Clear as Rust &mdash; Item Reference</p>
    <span class="alpha-tag">Pre-Alpha &middot; Subject to Change</span>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Search items, perks, weapons, or drop sources..." />
    <select id="sourceFilter">
      <option value="">All drop sources</option>
    </select>
  </div>

  <p class="count-line" id="count"></p>

  <div class="grid" id="grid"></div>
  <p class="empty-msg" id="empty">No items match your search.</p>

  <footer>
    &copy; 2026 Clear as Rust. Drop percentages = table chance &times; item's share of the weighted pool.
  </footer>
</div>

const weaponPerkLabels = {
  HeliDamage:"Heli damage", ScientistBane:"Scientist bane", Thorns:"Thorns", BeastBane:"Beast bane",
  Vampiric:"Vampiric", ScientistWard:"Scientist ward", BradleyDamage:"Bradley damage", UncannyDodge:"Uncanny dodge",

  Horticulture:"Horticulture", Regeneration:"Regeneration", Forager:"Forager", Builder:"Builder", Smelter:"Smelter",
  Prepper:"Prepper", FishingLuck:"Fishing luck", Angler:"Angler", LineStrength:"Line strength", Fabricate:"Fabricate",
  Thrifty:"Thrifty", IronStomach:"Iron stomach", Pharmaceutical:"Pharmaceutical", MeleeWard:"Melee ward",
  Lead:"Lead", HealShare:"Heal share", Paramedic:"Paramedic"
};

function buildDropMap() {
  const map = {};
  for (const profile of lootProfiles) {
    const totalWeight = Object.values(profile.weights).reduce((a,b) => a+b, 0);
    for (const [name, weight] of Object.entries(profile.weights)) {
      if (!map[name]) map[name] = [];
      const pickPct = (weight / totalWeight) * 100;
      const overallPct = (profile.chance / 100) * pickPct;
      map[name].push({source: profile.source, weight, tableChance: profile.chance, pickPct, overallPct});
    }
  }
  return map;
}
const dropMap = buildDropMap();

const sourceFilter = document.getElementById('sourceFilter');
lootProfiles.forEach(p => {
  const opt = document.createElement('option');
  opt.value = p.source;
  opt.textContent = p.source;
  sourceFilter.appendChild(opt);
});

function formatPerk(key, val) {
  const label = weaponPerkLabels[key] || key;
  let display;
  if (val < 1) display = '+' + Math.round(val * 100) + '%';
  else display = '+' + val + 'x';
  return label + ': ' + display;
}

function formatPct(p) {
  if (p >= 1) return p.toFixed(1) + '%';
  if (p >= 0.1) return p.toFixed(2) + '%';
  return p.toFixed(3) + '%';
}

function renderGrid() {
  const query = document.getElementById('search').value.toLowerCase();
  const sourceVal = sourceFilter.value;
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  grid.innerHTML = '';
  let shown = 0;
  const total = Object.keys(itemProfiles).length;

  for (const [name, item] of Object.entries(itemProfiles)) {
    const drops = dropMap[name] || [];
    if (sourceVal && !drops.some(d => d.source === sourceVal)) continue;

    const friendlyBase = displayName(item.shortname);
    const perkText = Object.entries(item.perks).map(([k,v]) => formatPerk(k,v).toLowerCase()).join(' ');
    const sourceText = drops.map(d => d.source).join(' ').toLowerCase();
    const haystack = (name + ' ' + item.shortname + ' ' + friendlyBase + ' ' + item.desc + ' ' + perkText + ' ' + sourceText).toLowerCase();
    if (query && !haystack.includes(query)) continue;

    shown++;
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('div');
    img.className = 'card-image';
    img.textContent = 'No image';
    card.appendChild(img);

    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = name;
    card.appendChild(title);

    const sub = document.createElement('div');
    sub.className = 'card-sub';
    sub.textContent = friendlyBase + (item.skin ? ' \u00b7 skin ' + item.skin : '') + (item.slots ? ' \u00b7 ' + item.slots + ' slot' + (item.slots > 1 ? 's' : '') : '');
    card.appendChild(sub);

    const perksBlock = document.createElement('div');
    perksBlock.className = 'perks';
    for (const [k,v] of Object.entries(item.perks)) {
      const row = document.createElement('div');
      row.className = 'perk-row';
      const valDisplay = v < 1 ? '+' + Math.round(v*100) + '%' : '+' + v + 'x';
      row.innerHTML = '<span>' + (weaponPerkLabels[k] || k) + '</span><span class="val">' + valDisplay + '</span>';
      perksBlock.appendChild(row);
    }
    card.appendChild(perksBlock);

    if (drops.length) {
      const label = document.createElement('div');
      label.className = 'drops-label';
      label.textContent = 'Drops from (' + drops.length + ')';
      card.appendChild(label);

      const sorted = [...drops].sort((a,b) => b.overallPct - a.overallPct);
      const table = document.createElement('table');
      table.className = 'drops-table';

      sorted.slice(0, 6).forEach(d => {
        const row = document.createElement('tr');
        const tdName = document.createElement('td');
        tdName.className = 'source';
        tdName.textContent = d.source;
        const tdPct = document.createElement('td');
        tdPct.className = 'pct';
        tdPct.textContent = formatPct(d.overallPct);
        tdPct.title = 'Table chance ' + d.tableChance + '% \u00d7 pick chance ' + formatPct(d.pickPct) + ' (weight ' + d.weight + ')';
        row.appendChild(tdName);
        row.appendChild(tdPct);
        table.appendChild(row);
      });
      card.appendChild(table);

      if (drops.length > 6) {
        const more = document.createElement('div');
        more.className = 'more-sources';
        more.textContent = '+' + (drops.length - 6) + ' more sources';
        card.appendChild(more);
      }
    } else {
      const noDrops = document.createElement('div');
      noDrops.className = 'no-drops';
      noDrops.textContent = 'No drop source configured';
      card.appendChild(noDrops);
    }

    const flavor = document.createElement('div');
    flavor.className = 'flavor';
    flavor.textContent = '"' + item.desc + '"';
    card.appendChild(flavor);

    grid.appendChild(card);
  }

  empty.style.display = shown === 0 ? 'block' : 'none';
  count.textContent = 'Showing ' + shown + ' of ' + total + ' items';
}

document.getElementById('search').addEventListener('input', renderGrid);
sourceFilter.addEventListener('change', renderGrid);
renderGrid();
